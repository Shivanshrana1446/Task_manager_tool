# Development stack: hot-reloading backend (nodemon) + frontend (Vite dev
# server), both bind-mounted from source, plus a local MongoDB instance.
#
# Usage:
#   cp backend/.env.example backend/.env    # fill in secrets
#   cp frontend/.env.example frontend/.env
#   docker compose up --build
#
#   API:      http://localhost:5000/api/v1
#   API docs: http://localhost:5000/api-docs
#   Frontend: http://localhost:5173

services:
  mongo:
    image: mongo:7
    container_name: task-manager-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: development
    container_name: task-manager-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/task_manager
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: task-manager-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mongo-data:
  backend-node-modules:
  frontend-node-modules:
