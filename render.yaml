services:
  - type: web
    name: task-manager-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      # Set the rest (CLIENT_URL, MONGODB_URI, JWT_SECRET, JWT_REFRESH_SECRET,
      # CLOUDINARY_*) in the Render dashboard — they're secrets/deployment-specific
      # and deliberately not in this file. See docs/RENDER_VERCEL_DEPLOYMENT.md.
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 10
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: LOG_LEVEL
        value: info
